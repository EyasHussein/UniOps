{% load static %}
{% with current=request.resolver_match.url_name %}
<nav class="w-64 min-h-screen bg-white border-r border-slate-200 flex flex-col justify-between sticky top-0">
    <div>
        <div class="px-6 py-6 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <!-- CHANGED: replaced U text logo with uploaded image -->
                <img src="{% static 'images/uniops-logo.png' %}" alt="UniOps logo" class="w-9 h-9 rounded-xl object-cover shadow-md flex-shrink-0">
                <div>
                    <div class="text-xl font-black text-slate-900 tracking-tight leading-none">UniOps</div>
                    <div class="text-[10px] text-slate-400 font-semibold uppercase tracking-widest mt-0.5">Admin Panel</div>
                </div>
            </div>
        </div>

        <div class="px-3 py-4 space-y-0.5">
            <p class="px-3 text-[10px] font-black text-slate-400 uppercase tracking-[0.15em] mb-2">Navigation</p>

            <a href="{% url 'dashboard' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-semibold transition-all text-sm group {% if current == 'dashboard' %}bg-indigo-50 text-indigo-700{% else %}text-slate-600 hover:bg-indigo-50 hover:text-indigo-700{% endif %}">
                <span class="w-8 h-8 rounded-lg flex items-center justify-center text-base flex-shrink-0 transition-colors {% if current == 'dashboard' %}bg-indigo-100{% else %}bg-slate-100 group-hover:bg-indigo-100{% endif %}">📊</span>
                Dashboard
            </a>

            <a href="{% url 'bookings' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-semibold transition-all text-sm group {% if current == 'bookings' %}bg-indigo-50 text-indigo-700{% else %}text-slate-600 hover:bg-indigo-50 hover:text-indigo-700{% endif %}">
                <span class="w-8 h-8 rounded-lg flex items-center justify-center text-base flex-shrink-0 transition-colors {% if current == 'bookings' %}bg-indigo-100{% else %}bg-slate-100 group-hover:bg-indigo-100{% endif %}">📅</span>
                Booking Requests
            </a>

            <a href="{% url 'rooms' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-semibold transition-all text-sm group {% if current == 'rooms' or current == 'building_rooms' or current == 'add_room' or current == 'update_room' %}bg-slate-100 text-slate-900{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %}">
                <span class="w-8 h-8 rounded-lg flex items-center justify-center text-base flex-shrink-0 transition-colors {% if current == 'rooms' or current == 'building_rooms' or current == 'add_room' or current == 'update_room' %}bg-slate-200{% else %}bg-slate-100 group-hover:bg-slate-200{% endif %}">🏫</span>
                Rooms Management
            </a>

            <a href="{% url 'maintenance' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-semibold transition-all text-sm group {% if current == 'maintenance' %}bg-amber-50 text-amber-700{% else %}text-slate-600 hover:bg-amber-50 hover:text-amber-700{% endif %}">
                <span class="w-8 h-8 rounded-lg flex items-center justify-center text-base flex-shrink-0 transition-colors {% if current == 'maintenance' %}bg-amber-100{% else %}bg-slate-100 group-hover:bg-amber-100{% endif %}">⚙️</span>
                Maintenance
            </a>

            <!-- CHANGED: complaints accent changed from red/rose to sky -->
            <a href="{% url 'complaints' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-semibold transition-all text-sm group {% if current == 'complaints' %}bg-sky-50 text-sky-700{% else %}text-slate-600 hover:bg-sky-50 hover:text-sky-700{% endif %}">
                <span class="w-8 h-8 rounded-lg flex items-center justify-center text-base flex-shrink-0 transition-colors {% if current == 'complaints' %}bg-sky-100{% else %}bg-slate-100 group-hover:bg-sky-100{% endif %}">⚠️</span>
                Complaints
            </a>
        </div>
    </div>

    <div class="border-t border-slate-100 px-3 py-4">
        <div class="flex items-center gap-3 px-3 py-2 mb-1">
            <div class="w-9 h-9 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-full flex items-center justify-center text-white text-xs font-black flex-shrink-0">
                {{ user.username|first|upper }}
            </div>
            <div class="min-w-0">
                <div class="text-sm font-bold text-slate-900 truncate">{{ user.username }}</div>
                <div class="text-[10px] text-indigo-600 font-bold uppercase">Admin</div>
            </div>
        </div>

        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="w-full flex items-center gap-2 px-3 py-2.5 rounded-xl text-slate-500 font-semibold text-sm hover:bg-rose-50 hover:text-rose-600 transition-all">
                ↩ Logout
            </button>
        </form>
    </div>
</nav>
{% endwith %}
